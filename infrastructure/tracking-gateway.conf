# Deployment template. Replace this reserved hostname before activation.
# It intentionally denies the WMS operational/admin routes.
pid /tmp/triton-tracking-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    access_log off;
    client_max_body_size 4k;
    server {
        listen 127.0.0.1:18773 default_server;
        server_name _;
        return 404;
    }
    server {
        listen 127.0.0.1:18773;
        server_name tracking.example.invalid;
        location = /tracking { proxy_pass http://127.0.0.1:8086; }
        location ^~ /tracking/ { proxy_pass http://127.0.0.1:8086; }
        location / { return 404; }
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_buffer_size 16k;
    }
}
