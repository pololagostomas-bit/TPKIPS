name: Abrir PR de cambios WMS

on:
  push:
    branches: ['**']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    if: github.event.deleted == false && github.ref_name != (vars.WMS_BASE_BRANCH || 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: this job does not execute scripts from the incoming branch.
      - name: Crear un PR o conservar el que ya existe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ vars.WMS_BASE_BRANCH || 'main' }}
          HEAD_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh pr list --repo "$GH_REPO" --base "$BASE_BRANCH" --head "$HEAD_BRANCH" --state open --json number --jq 'length')"
          if [ "$count" -gt 0 ]; then
            echo "El PR abierto ya incluye este push. No se crea un duplicado."
            exit 0
          fi
          compare_path="$(python3 -c 'import os,urllib.parse; q=urllib.parse.quote; print("repos/"+os.environ["GH_REPO"]+"/compare/"+q(os.environ["BASE_BRANCH"],safe="")+"..."+q(os.environ["HEAD_BRANCH"],safe=""))')"
          ahead="$(gh api "$compare_path" --jq '.ahead_by')"
          if [ "$ahead" -eq 0 ]; then
            echo "No hay commits nuevos para proponer."
            exit 0
          fi
          gh pr create --repo "$GH_REPO" --base "$BASE_BRANCH" --head "$HEAD_BRANCH" \
            --title "WMS: $HEAD_BRANCH" \
            --body "PR generado al subir cambios. Revisar y probar antes de fusionar. Este flujo no aprueba, no fusiona ni despliega cambios automaticamente."
