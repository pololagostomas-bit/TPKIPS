<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar · TRITON WMS</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/assets/wms-ui.css"></head>
<body class="login-page"><main class="login-card"><img src="/assets/triton-logo.png" width="180" alt="Triton"><p class="eyebrow">OPERACIONES DE ALMACÉN</p><h1>Tu jornada comienza aquí.</h1><p>Ingresa con el usuario asignado por el administrador.</p><form id="loginForm"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required><p id="error" role="alert"></p><button type="submit" class="primary">Ingresar</button></form><p class="login-foot">TRITON WMS · Recepción y despacho</p></main>
<script>document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;document.getElementById('error').textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-WMS-Request':'1'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const result=await response.json();if(!response.ok)throw new Error(result.error);location.href=['ASISTENTE_RECEPCION','AUXILIAR_RECEPCION'].includes(result.role)?'/reception':'/'}catch(error){document.getElementById('error').textContent=error.message||'No se pudo conectar'}finally{button.disabled=false}});</script></body></html>
