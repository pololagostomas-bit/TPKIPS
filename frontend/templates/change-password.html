<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cambiar contraseña · TRITON WMS</title><link rel="stylesheet" href="/assets/wms-ui.css">
<style>body.login-page{box-sizing:border-box;grid-template-columns:minmax(0,1fr)}.login-card{box-sizing:border-box;width:min(460px,100%);min-width:0;justify-self:center;border-radius:8px}.login-card input{box-sizing:border-box;width:100%}.login-card label,.login-card #error{overflow-wrap:anywhere}.password-actions{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}</style>
</head><body class="login-page"><main class="login-card">
<div class="login-brand"><img src="/assets/triton-logo.png" width="240" alt="Triton"><div class="login-product-name">TRITON WMS</div></div>
<h2>Cambia tu contraseña</h2>
<form id="passwordForm">
<label for="current">Contraseña temporal o actual</label><input id="current" type="password" autocomplete="current-password" required maxlength="256">
<label for="newPassword">Nueva contraseña (mínimo 12 caracteres)</label><input id="newPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="256">
<label for="confirmation">Repetir nueva contraseña</label><input id="confirmation" type="password" autocomplete="new-password" required minlength="12" maxlength="256">
<p id="error" role="alert"></p><div class="password-actions"><button class="primary" type="submit">Guardar contraseña</button><button type="button" id="logout">Salir</button></div>
</form></main><script>
(() => {
  if (location.hostname.endsWith('.trycloudflare.com') && location.protocol !== 'https:') {
    const url = new URL(location.href); url.protocol = 'https:'; location.replace(url.href); return;
  }
  const form = document.getElementById('passwordForm');
  const errorText = document.getElementById('error');
  form.addEventListener('submit', async event => {
    event.preventDefault();
    const button = form.querySelector('button[type="submit"]');
    const next = document.getElementById('newPassword').value;
    const confirmation = document.getElementById('confirmation').value;
    errorText.textContent = '';
    if (next !== confirmation) {errorText.textContent = 'Las contraseñas nuevas no coinciden';return;}
    button.disabled = true;
    try {
      const response = await fetch('/api/change-password', {method:'POST',credentials:'same-origin',cache:'no-store',
        headers:{'Content-Type':'application/json','X-WMS-Request':'1'},body:JSON.stringify({
          current_password:document.getElementById('current').value,new_password:next,confirm_password:confirmation})});
      if (!response.headers.get('Content-Type')?.includes('application/json')) throw new Error('El servidor no respondió correctamente. Vuelve a ingresar.');
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'No se pudo cambiar la contraseña');
      form.reset();
      location.assign(['ASISTENTE_RECEPCION','AUXILIAR_RECEPCION'].includes(result.role) ? '/reception' : '/');
    } catch (error) {errorText.textContent = error.message || 'No se pudo conectar al servidor';}
    finally {button.disabled = false;}
  });
  document.getElementById('logout').onclick = async () => {
    try {await fetch('/api/logout',{method:'POST',headers:{'X-WMS-Request':'1'}}); location.assign('/login');}
    catch (_) {errorText.textContent = 'No se pudo cerrar la sesión. Intenta nuevamente';}
  };
})();
</script></body></html>
